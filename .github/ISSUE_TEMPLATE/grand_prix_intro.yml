name: Grand Prix start-up intro
description: Tell us which update had which Grand Prix start-up intro (information only, no game files).
title: "[Grand Prix intro] "
labels: ["grand-prix-intro"]
body:
  - type: markdown
    attributes:
      value: |
        Each Grand Prix season of Crash Team Racing Nitro-Fueled had its own start-up intro: the
        scene where a character jumps into the CTR logo before "Press X to begin". The next update
        replaced it: the final update (1.21) only has Crash's (`octane_startscreen.pak`, with his
        Game Awards statue since 1.18). Themed start screens came with 1.09 (Spyro & Friends), 1.12
        (Spooky), 1.14 (Neon Circus) and 1.16 (Winter Festival). CTR TV
        episodes have their own form (*CTR TV episode*).

        If you dumped an older update from your own console, tell us what its start-up intro was
        and which files changed, so the port can offer it.

        **Do not attach, upload or link game files** (videos, `.pak`, `.pkg`, dumps, saves): they are
        Activision's and cannot be shared here. Names, sizes and checksums are enough.
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - European (CUSA14876)
        - USA (CUSA13795)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Update version
      description: |
        The update's version (sce_sys/param.sfo APP_VER; PS4 numbers). The seasons' updates: Nitro Tour 1.04,
        Back N. Time 1.08, Spyro & Friends 1.09, Spooky 1.12, Neon Circus 1.14, Winter Festival 1.16,
        Rustland 1.17, Gasmoxia 1.19.
      placeholder: "01.12"
    validations:
      required: true
  - type: input
    id: grand_prix
    attributes:
      label: Grand Prix
      description: Which Grand Prix season this update was for, if you know it.
      placeholder: "Neon Circus"
  - type: input
    id: character
    attributes:
      label: Character in the intro
      description: Who jumps into the logo in this update's start-up intro.
      placeholder: "Spyro"
  - type: textarea
    id: files
    attributes:
      label: Start screen files
      description: |
        `octane_startscreen.pak`, `juicedomain_startscreen.pak` and any other new `.pak` or `.bk2` in the
        update's `archives` folder, each with its size in bytes and its SHA-256
        (`sha256sum archives/octane_startscreen.pak` on Linux, `Get-FileHash` in PowerShell).
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Other things you noticed (a recording's link is welcome; game files are not).
  - type: checkboxes
    id: rules
    attributes:
      label: Game files
      options:
        - label: I did not attach, upload or link any game files.
          required: true
