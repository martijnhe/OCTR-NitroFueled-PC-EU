name: CTR TV episode
description: Tell us which update had which CTR TV episode (information only, no game files).
title: "[CTR TV] "
labels: ["ctr-tv"]
body:
  - type: markdown
    attributes:
      value: |
        Every Grand Prix season came with its own CTR TV broadcast, a video in the update's
        `archives` folder named `CTRTV_<something>.bk2`, and the next update replaced it: the final
        update (1.21) only has the February Grand Prix's `CTRTV_FebGP.bk2`. This port plays any
        `CTRTV_*.bk2` it finds in your own game folder (menu: L3 + R3 > CTR TV > Episode).

        If you dumped an older update from your own console, tell us which episode it has, so
        others can check their own dumps.

        **Do not attach, upload or link game files** (videos, `.pak`, `.pkg`, dumps, saves): they are
        Activision's and cannot be shared here. Names, sizes and checksums are enough.
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - European (CUSA14876)
        - USA (CUSA13795)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Update version
      description: The update's version (sce_sys/param.sfo APP_VER), for example 01.10.
      placeholder: "01.10"
    validations:
      required: true
  - type: input
    id: grand_prix
    attributes:
      label: Grand Prix
      description: Which Grand Prix season the episode belongs to, if you know it.
      placeholder: "Neon Circus"
  - type: textarea
    id: files
    attributes:
      label: CTR TV files
      description: |
        Every `CTRTV_*.bk2` in the update's `archives` folder, each with its size in bytes and its
        SHA-256 (`sha256sum archives/CTRTV_*.bk2` on Linux, `Get-FileHash archives\CTRTV_*.bk2` in
        PowerShell).
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Does it play from the port's menu (CTR TV > Episode)? What is in the episode?
  - type: checkboxes
    id: rules
    attributes:
      label: Game files
      options:
        - label: I did not attach, upload or link any game files.
          required: true
